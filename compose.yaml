name: java-repair-ticket-system

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repair_tickets}
      POSTGRES_USER: ${POSTGRES_USER:-repair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-repair_tickets}
      DATABASE_USER: ${POSTGRES_USER:-repair}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      REPAIR_DEMO_ENABLED: ${REPAIR_DEMO_ENABLED:-true}
      REPAIR_DEMO_CUSTOMER_PASSWORD: ${REPAIR_DEMO_CUSTOMER_PASSWORD:-}
      REPAIR_DEMO_SUPPORT_PASSWORD: ${REPAIR_DEMO_SUPPORT_PASSWORD:-}
      REPAIR_DEMO_TECHNICIAN_PASSWORD: ${REPAIR_DEMO_TECHNICIAN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
