spring:
  application:
    name: java-repair-ticket-system
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/repair_tickets}
    username: ${DATABASE_USER:repair}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
  thymeleaf:
    cache: true
  mvc:
    problemdetails:
      enabled: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

repair:
  demo:
    enabled: ${REPAIR_DEMO_ENABLED:false}
    customer-password: ${REPAIR_DEMO_CUSTOMER_PASSWORD:}
    support-password: ${REPAIR_DEMO_SUPPORT_PASSWORD:}
    technician-password: ${REPAIR_DEMO_TECHNICIAN_PASSWORD:}
