spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/repair-ticket-system;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  h2:
    console:
      enabled: false

repair:
  demo:
    enabled: ${REPAIR_DEMO_ENABLED:true}
